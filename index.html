<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-[#F8FAFC] font-Geist">

    <header class="pt-15 pb-7.5">
        <div class="container mx-auto px-5 md:px-8">
            <h1 class="text-3xl font-bold text-[#002C5C] mb-5">Job Application Tracker</h1>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-[#FFFFFF] p-5 border border-[#F1F2F4]">
                    <p class="mb-2 text-[14px] font-medium">Total</p>
                    <p class="text-2xl font-bold text-[#002C5C]">0</p>
                </div>
                 <div class="bg-[#FFFFFF] p-5 border border-[#F1F2F4]">
                    <p class="mb-2 text-[14px] font-medium ">Interview</p>
                    <p class="text-2xl font-bold text-green-500">0</p>
                </div>
                 <div class="bg-[#FFFFFF] p-5 border border-[#F1F2F4]">
                  <p class="mb-2 text-[14px] font-medium ">Rejected</p>
                    <p class="text-2xl font-bold text-red-500">0</p>
                </div>
            </div>
        </div>
    </header>

    <main>
        
    </main>

</body>

</html>
